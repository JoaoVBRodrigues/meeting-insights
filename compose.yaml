services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pauta
      POSTGRES_PASSWORD: pauta_demo
      POSTGRES_DB: pauta
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pauta-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pauta -d pauta"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pauta-data:
